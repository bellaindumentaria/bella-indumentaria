<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light only">
  <title>BELLA Indumentaria - Catálogo Mayorista</title>
  <style>
    :root {
      color-scheme: light only;
      --rosa-pastel: #F8BBD0;
      --rosa-fondo: #FCE4EC;
      --fucsia: #E91E63;
      --fucsia-oscuro: #C2185B;
      --negro: #1A1A1A;
      --blanco: #FFFFFF;
      --gris-borde: #E0E0E0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: #FCE4EC !important;
      color: #1A1A1A !important;
    }

    /* Encabezado */
    header {
      background-color: #F8BBD0 !important;
      border-bottom: 5px solid #E91E63;
      padding: 16px 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      width: 100%;
    }

    header img {
      max-width: 130px;
      border-radius: 10px;
      border: 2px solid #1A1A1A;
      margin-bottom: 6px;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 3px;
      color: #1A1A1A !important;
      text-transform: uppercase;
    }

    header p {
      color: #C2185B !important;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Contenedor Principal */
    .layout-principal {
      display: flex;
      align-items: flex-start;
      max-width: 1340px;
      width: 100%;
      margin: 20px auto;
      padding: 0 15px;
      gap: 22px;
    }

    /* Izquierda: 3 Columnas en PC */
    .seccion-productos {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      width: 100%;
    }

    .card-producto {
      background-color: #FFFFFF !important;
      border: 2px solid #F8BBD0;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(233, 30, 99, 0.08);
    }

    .card-producto img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 10px;
      background-color: #F8BBD0;
      margin-bottom: 10px;
      border: 1px solid #E0E0E0;
    }

    .card-producto h3 {
      font-size: 1.15rem;
      color: #1A1A1A !important;
      margin-bottom: 4px;
    }

    .card-producto .precio {
      font-size: 1.3rem;
      font-weight: bold;
      color: #E91E63 !important;
      margin-bottom: 10px;
    }

    .campo-opcion {
      margin-bottom: 8px;
      text-align: left;
    }

    .campo-opcion label {
      display: block;
      font-size: 0.82rem;
      font-weight: bold;
      color: #444444 !important;
      margin-bottom: 3px;
    }

    .campo-opcion select, .campo-opcion input {
      width: 100%;
      padding: 9px;
      border: 1px solid #CCCCCC;
      border-radius: 8px;
      font-size: 0.92rem;
      background-color: #FFFFFF !important;
      color: #1A1A1A !important;
    }

    .fila-talle-cant {
      display: flex;
      gap: 8px;
    }

    .fila-talle-cant .campo-opcion:first-child {
      flex: 2;
    }

    .fila-talle-cant .campo-opcion:last-child {
      flex: 1;
    }

    .btn-agregar {
      background-color: #1A1A1A !important;
      color: #FFFFFF !important;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      font-size: 0.95rem;
    }

    .btn-agregar:hover {
      background-color: #E91E63 !important;
    }

    /* Mini Columna Derecha (Carrito) */
    .columna-carrito {
      width: 340px;
      flex-shrink: 0;
      background-color: #FFFFFF !important;
      border: 2px solid #1A1A1A;
      border-radius: 14px;
      padding: 16px;
      position: sticky;
      top: 15px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    .columna-carrito h2 {
      font-size: 1.2rem;
      border-bottom: 2px solid #F8BBD0;
      padding-bottom: 8px;
      margin-bottom: 10px;
      color: #1A1A1A !important;
    }

    .aviso-minimo {
      background-color: #FFF0F5 !important;
      border: 1px dashed #E91E63;
      color: #C2185B !important;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }

    .aviso-minimo.cumplido {
      background-color: #E8F5E9 !important;
      border: 1px solid #4CAF50;
      color: #2E7D32 !important;
    }

    #lista-carrito {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
      border-bottom: 1px solid #E0E0E0;
      padding-bottom: 8px;
    }

    #lista-carrito li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #F2F2F2;
      font-size: 0.85rem;
      gap: 6px;
      color: #1A1A1A !important;
    }

    .btn-quitar {
      background-color: #FF4D4D !important;
      color: #FFFFFF !important;
      border: none;
      border-radius: 5px;
      padding: 4px 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.78rem;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      font-size: 1.15rem;
      font-weight: bold;
      color: #1A1A1A !important;
      margin-bottom: 12px;
      padding: 9px;
      background-color: #FCE4EC !important;
      border-radius: 8px;
    }

    .total-box span:last-child {
      color: #C2185B !important;
    }

    .seccion-form h3 {
      font-size: 0.92rem;
      margin-bottom: 8px;
      color: #1A1A1A !important;
      border-top: 1px solid #E0E0E0;
      padding-top: 10px;
    }

    .form-grupo {
      margin-bottom: 8px;
    }

    .form-grupo input, .form-grupo select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #CCCCCC;
      border-radius: 7px;
      font-size: 0.9rem;
      background-color: #FFFFFF !important;
      color: #1A1A1A !important;
    }

    /* Cuadrito especial para transporte opcional */
    #grupo-transporte-otro {
      display: none;
      background-color: #FFF0F5;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #E91E63;
      margin-bottom: 8px;
    }

    #grupo-transporte-otro input {
      border: 1px solid #E91E63;
    }

    .fila-doble {
      display: flex;
      gap: 8px;
    }

    .btn-whatsapp {
      background-color: #25D366 !important;
      color: #FFFFFF !important;
      border: none;
      padding: 13px;
      width: 100%;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-whatsapp:disabled {
      background-color: #9E9E9E !important;
      cursor: not-allowed;
    }

    footer {
      background-color: #1A1A1A !important;
      color: #F8BBD0 !important;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
      font-size: 0.85rem;
      width: 100%;
    }

    /* ADAPTACIÓN PARA CELULARES Y TABLETS */
    @media (max-width: 1050px) {
      .seccion-productos {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 820px) {
      .layout-principal {
        flex-direction: column;
        padding: 0 12px;
        margin: 15px auto;
      }
      .seccion-productos {
        grid-template-columns: 1fr;
        width: 100%;
      }
      .columna-carrito {
        width: 100%;
        position: static;
      }
      header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Logo Bella Indumentaria" onerror="this.style.display='none'">
    <h1>BELLA</h1>
    <p>FABRICANTE DIRECTO • COMPRA MÍNIMA $70.000</p>
  </header>

  <main class="layout-principal">
    
    <!-- COLUMNA IZQUIERDA: TUS 3 PRODUCTOS -->
    <section class="seccion-productos">

      <!-- PRODUCTO 1: VESTIDO FRANCHESCA -->
      <div class="card-producto">
        <div>
          <img src="franchesca.jpg" alt="Vestido Franchesca" onerror="this.src='https://placehold.co'">
          <h3>Vestido Franchesca</h3>
          <p class="precio">$15.000</p>
        </div>
        <div>
          <div class="campo-opcion">
            <label>Color:</label>
            <select id="color-1">
              <option value="Negro">Negro</option>
              <option value="Choco">Choco</option>
              <option value="Blanco">Blanco</option>
              <option value="Uva">Uva</option>
            </select>
          </div>
          <div class="fila-talle-cant">
            <div class="campo-opcion">
              <label>Talle:</label>
              <select id="talle-1">
                <option value="Talle Único">Talle Único</option>
              </select>
            </div>
            <div class="campo-opcion">
              <label>Cant.:</label>
              <input type="number" id="cant-1" value="1" min="1">
            </div>
          </div>
          <button class="btn-agregar" onclick="agregarProducto('Vestido Franchesca', 15000, 'color-1', 'talle-1', 'cant-1')">Agregar al carrito</button>
        </div>
      </div>

      <!-- PRODUCTO 2: MARILYN LUNARES -->
      <div class="card-producto">
        <div>
          <img src="marilyn.jpg" alt="Marilyn Lunares" onerror="this.src='https://placehold.co'">
          <h3>Marilyn Lunares</h3>
          <p class="precio">$15.000</p>
        </div>
        <div>
          <div class="campo-opcion">
            <label>Color:</label>
            <select id="color-2">
              <option value="Negro">Negro</option>
